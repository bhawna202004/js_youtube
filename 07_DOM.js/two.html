<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: black; color: whitesmoke;">
    <div class="parent">
        <div class="day"> monday</div>
        <div class="day">tuesday </div>
        <div class="day" >wednesday</div>
        <div class="day">thursday</div>
    </div>
</body>

<script>
  const parent =  document.querySelector('.parent')
//   console.log(parent);
//     console.log(parent.children[2].innerText);
    
// for (let i = 0; i < parent.children.length; i++) {
// console.log(parent.children[i].innerText  )  
// }

parent.children[1].style.color = "magenta"
console.log(parent.firstElementChild);     // return first child
console.log(parent.lastElementChild);      // return last child

const dayOne = document.querySelector('.day')
console.log(dayOne);                           // return dayone i.e, monday
console.log(dayOne.parentElement);             // return all elements of parent node
console.log(dayOne.nextElementSibling);        // return adjacent node of mention var

console.log("nodes :", parent.childNodes);      // it give all nodes including space line

</script>

</html>
