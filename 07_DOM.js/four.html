<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black; color: #ffff;">
    
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>

<script>
    // to add element
    function addLanguage(langName){
      const li =  document.createElement('li');
      li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("python")
    addLanguage("c++")
    addLanguage("html")

    // optimize approch bcz no tree traversing
  function addOptimizeLanguage(langName){
      const li = document.createElement('li');
      li.appendChild(document.createTextNode(langName))
      document.querySelector('.language').appendChild(li)
    }
    addOptimizeLanguage("php")

   // edit or replace 
   // 1)
      const secondLang = document.querySelector("li:nth-child(2)")
      const newLi = document.createElement('li')
      newLi.textContent = "oops"
      secondLang.replaceWith(newLi)

    // 2)
      const thirdLang = document.querySelector("li:nth-child(3)")
       thirdLang.outerHTML = '<li>Typescript</li>'
       

   // remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()

    
</script>

</html>
